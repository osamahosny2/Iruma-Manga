name: Iruma Manga 1.4.0 - Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - iruma-manga-1.4.0

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK metadata
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package: name='com.aistudio.irumamanga.rkfpxq.next'.*versionCode='10400'.*versionName='1.4.0'"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Iruma Manga 1.4.0.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Iruma-Manga-1.4.0-debug
          path: Iruma Manga 1.4.0.apk
          if-no-files-found: error
